name: Compile Test Probe

on:
  workflow_dispatch:
    inputs:
      enhancement_run_id:
        description: "Our own enhancement run id, for correlation"
        required: true

run-name: "compile-${{ inputs.enhancement_run_id }}"

jobs:
  compile-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Set variables
        run: echo "starting"

      - name: Download ZIP
        run: |
          echo "pretending to download..."
          sleep 3

      - name: Unzip
        run: |
          echo "pretending to unzip..."
          sleep 2

      - name: Compile
        run: |
          for i in $(seq 1 12); do
            echo "compile progress line $i of 12"
            sleep 2
          done
          echo "COMPILE_DONE_MARKER"

      - name: Done
        run: echo "all steps finished"
