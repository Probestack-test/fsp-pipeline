name: Reusable Apigee CI/CD (K8s Runner)

on:
  workflow_call:

    inputs:

      # -------------------------------------------------
      # APIGEE
      # -------------------------------------------------
      apigee_org:
        required: true
        type: string

      apigee_env:
        required: true
        type: string

      deploy_proxy:
        required: true
        type: string

      resourcetype:
        required: true
        type: string

      node_version:
        required: false
        default: '18'
        type: string

      branch_name:
        required: false
        type: string

      # -------------------------------------------------
      # FORGESPHERE
      # -------------------------------------------------
      cicd_config_id:
        required: true
        type: string

      cicd_config_url:
        required: false
        default: 'https://forgesphere.probestack.io/cicd-automation/v1/api/cicd-config'
        type: string

      # -------------------------------------------------
      # OPTIONAL VERSION OVERRIDE
      # -------------------------------------------------
      version:
        required: false
        default: ''
        type: string

    secrets:

      # GitHub authentication
      GH_TOKEN:
        required: true
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true


# =========================================================
# PERMISSIONS
# =========================================================

permissions:
  contents: read


# =========================================================
# GLOBAL ENV
# =========================================================

env:
  RESOURCE_TYPE: ${{ inputs.resourcetype }}
  BUNDLE_DIR: ${{ inputs.resourcetype == 'apis' && 'apiproxy' || 'sharedflowbundle' }}

  # CHANGE 1:
  # PR merge -> target/base branch (release)
  # Normal push -> caller supplied/current branch
  EFFECTIVE_BRANCH: ${{ github.event_name == 'pull_request' && github.base_ref || inputs.branch_name || github.ref_name }}


# =========================================================
# JOB
# =========================================================

jobs:
  build-lint-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ===================================================
      # SETUP
      # ===================================================

      - name: Start group Setup
        run: echo "::group::Setup"


      # ---------------------------------------------------
      # CHECKOUT
      # ---------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

        # CHANGE 2:
        # PR merge to release -> checkout release
        with:
          ref: ${{ env.EFFECTIVE_BRANCH }}


      - name: Verify checkout branch
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "head_ref=${{ github.head_ref }}"
          echo "base_ref=${{ github.base_ref }}"
          echo "input_branch=${{ inputs.branch_name }}"
          echo "effective_branch=${{ env.EFFECTIVE_BRANCH }}"
          echo "github_ref=${{ github.ref }}"
          echo "github_ref_name=${{ github.ref_name }}"
          echo "git_branch=$(git branch --show-current)"


      # ---------------------------------------------------
      # NODE
      # ---------------------------------------------------

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}


      # ---------------------------------------------------
      # TOOLS
      # ---------------------------------------------------

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip


      # ---------------------------------------------------
      # GITHUB AUTH
      # ---------------------------------------------------

      - name: Force GitHub auth
        run: |
          git config --global \
            url."https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/".insteadOf \
            "https://github.com/"


      - name: End group Setup
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # VALIDATION
      # ===================================================

      - name: Start group Validation
        run: echo "::group::Validation"


      - name: Validate Resource Type
        run: |
          set -euo pipefail

          if [[ "${{ inputs.resourcetype }}" != "apis" &&
                "${{ inputs.resourcetype }}" != "sharedflows" ]]; then

            echo "Invalid resourcetype: ${{ inputs.resourcetype }}"
            exit 1
          fi


      # ---------------------------------------------------
      # VALIDATE RELEASE PROPERTIES
      # ---------------------------------------------------

      - name: Validate release.properties
        run: |
          set -euo pipefail

          if [ ! -f release.properties ]; then
            echo "ERROR: release.properties not found"
            exit 1
          fi

          if ! grep -q '^version=' release.properties; then
            echo "ERROR: version property not found"
            exit 1
          fi

          BASE_VERSION=$(grep '^version=' release.properties | cut -d'=' -f2)

          echo "Base version: $BASE_VERSION"


      - name: End group Validation
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # FORGESPHERE CONFIGURATION
      # ===================================================

      - name: Start group ForgeSphere Configuration
        run: echo "::group::ForgeSphere Configuration"


      - name: Load ForgeSphere CI/CD Configuration
        id: config
        shell: bash

        env:
          CICD_CONFIG_URL: ${{ inputs.cicd_config_url }}
          CICD_CONFIG_ID: ${{ inputs.cicd_config_id }}

        run: |
          set -euo pipefail

          CONFIG_URL="${CICD_CONFIG_URL%/}/${CICD_CONFIG_ID}/all?filtered=true"

          echo "Fetching ForgeSphere CI/CD configuration... ${CONFIG_URL}"

          APIGEE_PROXY="${APIGEE_PROXY:-}"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --location \
            --output cicd-config.json \
            --write-out "%{http_code}" \
            "$CONFIG_URL")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Failed to retrieve CI/CD configuration"
            echo "HTTP status: $HTTP_STATUS"
            exit 1
          fi

          if [ ! -s cicd-config.json ]; then
            echo "ERROR: Empty CI/CD configuration"
            exit 1
          fi

          jq empty cicd-config.json

          # Extract only APIGEE_PROXY configuration
          jq '{
            strategies: .strategies,
            pipelineConfig: .pipelineConfigs.APIGEE_PROXY
          }' cicd-config.json > apigee-config.json

          echo "APIGEE_PROXY: $APIGEE_PROXY"


          # ------------------------------------------------
          # BRANCH STRATEGY
          # ------------------------------------------------

          MERGE_BRANCH=$(jq -r '
            .strategies[]
            | .branches[]
            | select(.tag == "merge")
            | .name
          ' apigee-config.json | head -n 1)


          MERGE_TAG=$(jq -r '
            .strategies[]
            | .branches[]
            | select(.tag == "merge")
            | .tag
          ' apigee-config.json | head -n 1)


          if [ -z "$MERGE_BRANCH" ] || [ "$MERGE_BRANCH" = "null" ]; then
            echo "ERROR: merge branch not configured"
            exit 1
          fi


          # ------------------------------------------------
          # SONAR CONFIGURATION
          # ------------------------------------------------

          SONAR_HOST_URL=$(jq -r '.pipelineConfig.securityToolConfigs.sonarscanner.SONAR_HOST_URL' apigee-config.json)
          SONAR_TOKEN=$(jq -r '.pipelineConfig.securityToolConfigs.sonarscanner.SONAR_TOKEN' apigee-config.json)
          SONAR_PROJECT_KEY=${{ inputs.deploy_proxy }}


          # ------------------------------------------------
          # VALIDATE SONAR
          # ------------------------------------------------

          if [ -z "$SONAR_HOST_URL" ] ||
             [ "$SONAR_HOST_URL" = "null" ]; then

            echo "ERROR: SONAR_HOST_URL not configured"
            exit 1
          fi


          if [ -z "$SONAR_TOKEN" ] ||
             [ "$SONAR_TOKEN" = "null" ]; then

            echo "ERROR: SONAR_TOKEN not configured"
            exit 1
          fi


          if [ -z "$SONAR_PROJECT_KEY" ] ||
             [ "$SONAR_PROJECT_KEY" = "null" ]; then

            echo "ERROR: SONAR_PROJECT_KEY not configured"
            exit 1
          fi


          # ------------------------------------------------
          # NEXUS CONFIGURATION
          # ------------------------------------------------

          NEXUS_URL=$(jq -r '.pipelineConfig.artifactToolConfigs.nexus.NEXUS_URL' apigee-config.json)

          NEXUS_USERNAME=$(jq -r '.pipelineConfig.artifactToolConfigs.nexus.NEXUS_USERNAME' apigee-config.json)

          NEXUS_PASSWORD=$(jq -r '.pipelineConfig.artifactToolConfigs.nexus.NEXUS_PASSWORD' apigee-config.json)

          NEXUS_REPOSITORY=$(jq -r '.pipelineConfig.artifactToolConfigs.nexus.NEXUS_REPOSITORY' apigee-config.json)


          # ------------------------------------------------
          # MASK SECRETS
          # ------------------------------------------------

          echo "::add-mask::$SONAR_TOKEN"

          if [ -n "$NEXUS_PASSWORD" ]; then
            echo "::add-mask::$NEXUS_PASSWORD"
          fi


          # ------------------------------------------------
          # OUTPUTS
          # ------------------------------------------------

          {
            echo "merge_branch=$MERGE_BRANCH"
            echo "merge_tag=$MERGE_TAG"
            echo "sonar_host_url=$SONAR_HOST_URL"
            echo "sonar_project_key=$SONAR_PROJECT_KEY"
            echo "sonar_token=$SONAR_TOKEN"
            echo "nexus_url=$NEXUS_URL"
            echo "nexus_username=$NEXUS_USERNAME"
            echo "nexus_password=$NEXUS_PASSWORD"
            echo "nexus_repository=$NEXUS_REPOSITORY"
          } >> "$GITHUB_OUTPUT"


          echo "========================================"
          echo "ForgeSphere configuration loaded"
          echo "Merge branch : $MERGE_BRANCH"
          echo "Merge tag    : $MERGE_TAG"
          echo "Sonar URL    : $SONAR_HOST_URL"
          echo "Sonar Project: $SONAR_PROJECT_KEY"
          echo "Nexus Config : $([ -n "$NEXUS_URL" ] && echo "configured" || echo "not configured")"
          echo "========================================"


      - name: End group ForgeSphere Configuration
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # OPTIONAL GITHUB APP TOKEN
      # ===================================================

      - name: Generate GitHub App token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}


      - name: Select Token
        id: token-select
        shell: bash
        run: |
          TOKEN="${{ steps.app-token.outputs.token }}"

          if [ -n "$TOKEN" ]; then
            echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "token=${{ secrets.GH_TOKEN }}" >> "$GITHUB_OUTPUT"
          fi


      # ===================================================
      # LINT
      # ===================================================

      - name: Start group Lint
        run: echo "::group::Lint"


      - name: Checkout lint rules
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ForgeCrux/apigee-linting-custom
          ref: develop
          path: apigee-linting-custom
          token: ${{ steps.token-select.outputs.token }}


      - name: Apigee Lint
        continue-on-error: true
        run: |
          if [ -d "./apigee-linting-custom" ]; then

            npx apigeelint \
              -s "$BUNDLE_DIR" \
              -x ./apigee-linting-custom/rules \
              -f table.js || true

          else
            echo "Skipping Apigee lint"
          fi


      - name: JS Lint
        continue-on-error: true
        run: |
          npx jslint "$BUNDLE_DIR"/**/*.js || true


      # ===================================================
      # SONAR
      # ===================================================

      - name: Sonar Scan
        continue-on-error: true

        env:
          SONAR_HOST_URL: ${{ steps.config.outputs.sonar_host_url }}
          SONAR_TOKEN: ${{ steps.config.outputs.sonar_token }}
          SONAR_PROJECT_KEY: ${{ steps.config.outputs.sonar_project_key }}

        run: |
          set -euo pipefail

          echo "Running SonarQube scan"

          npx sonarqube-scanner \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.sources="$BUNDLE_DIR"


      - name: End group Lint
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # VERSION
      # ===================================================

      - name: Calculate Version
        id: version
        shell: bash

        env:
          INPUT_VERSION: ${{ inputs.version }}

        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then

            VERSION="$INPUT_VERSION"

          else

            BASE_VERSION=$(grep '^version=' release.properties | cut -d'=' -f2)

            SHORT_SHA=$(git rev-parse --short HEAD)

            VERSION="${BASE_VERSION}-${SHORT_SHA}"

          fi

          echo "Version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"


      # ===================================================
      # PACKAGE
      # ===================================================

      - name: Start group Package
        run: echo "::group::Package"


      - name: Package Proxy
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.resourcetype }}" = "apis" ]; then
            ZIP_FILE="proxy.zip"
          else
            ZIP_FILE="sharedflowbundle.zip"
          fi

          echo "RESOURCE_TYPE=$RESOURCE_TYPE"
          echo "BUNDLE_DIR=$BUNDLE_DIR"
          echo "ZIP_FILE=$ZIP_FILE"

          test -d "$BUNDLE_DIR"

          zip -r "$ZIP_FILE" "$BUNDLE_DIR"

          ARTIFACT_NAME="${{ inputs.deploy_proxy }}.zip"

          cp "$ZIP_FILE" "$ARTIFACT_NAME"

          echo "========================================"
          echo "ZIP CREATED"
          echo "Artifact: $ARTIFACT_NAME"
          echo "Version : ${{ steps.version.outputs.version }}"
          echo "========================================"

          ls -lh "$ZIP_FILE" "$ARTIFACT_NAME"


      - name: End group Package
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # NEXUS PUSH
      # ===================================================

      - name: Start group Nexus Push
        run: echo "::group::Nexus Push"


      - name: Push Package to Nexus
        if: steps.config.outputs.nexus_url != '' && steps.config.outputs.merge_branch == inputs.branch_name
        shell: bash

        env:
          NEXUS_URL: ${{ steps.config.outputs.nexus_url }}
          NEXUS_REPOSITORY: ${{ steps.config.outputs.nexus_repository }}
          NEXUS_USERNAME: ${{ steps.config.outputs.nexus_username }}
          NEXUS_PASSWORD: ${{ steps.config.outputs.nexus_password }}

        run: |
          set -euo pipefail

          ARTIFACT_NAME="${{ inputs.deploy_proxy }}.zip"

          VERSION="${{ steps.version.outputs.version }}"

          if [ ! -f "$ARTIFACT_NAME" ]; then
            echo "ERROR: Package not found: $ARTIFACT_NAME"
            exit 1
          fi

          if [ -z "$NEXUS_REPOSITORY" ]; then
            echo "ERROR: Nexus repository not configured"
            exit 1
          fi

          UPLOAD_URL="${NEXUS_URL%/}/repository/${NEXUS_REPOSITORY}/${{ inputs.deploy_proxy }}/${VERSION}/${ARTIFACT_NAME}"

          echo "========================================"
          echo "NEXUS UPLOAD"
          echo "========================================"
          echo "Host : $UPLOAD_URL - ${NEXUS_URL%/}"
          echo "Repository : $NEXUS_REPOSITORY"
          echo "Artifact   : $ARTIFACT_NAME"
          echo "Version    : $VERSION"
          echo "========================================"

          curl \
            --fail \
            --show-error \
            --silent \
            --user "${NEXUS_USERNAME}:${NEXUS_PASSWORD}" \
            --upload-file "$ARTIFACT_NAME" \
            "$UPLOAD_URL"

          echo "Nexus upload successful"


      - name: Nexus not configured
        if: steps.config.outputs.nexus_url == ''
        run: |
          echo "Nexus configuration not available from ForgeSphere"
          echo "Skipping Nexus upload"


      - name: End group Nexus Push
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # TOKEN SERVICE AUTH
      # ===================================================

      - name: Start group Token auth
        run: echo "::group::Token auth"


      - name: Get Access Token
        id: token
        run: |
          set -euo pipefail

          RESPONSE=$(curl \
            -s \
            -w "\nHTTP_STATUS:%{http_code}\n" \
            https://token-service-113875395623.us-central1.run.app/token)

          STATUS=$(echo "$RESPONSE" |
            grep HTTP_STATUS |
            cut -d':' -f2)

          if [ "$STATUS" -ne 200 ]; then
            echo "Failed to fetch token"
            exit 1
          fi

          ACCESS_TOKEN=$(echo "$RESPONSE" |
            head -n 1 |
            jq -r '.access_token')

          if [ -z "$ACCESS_TOKEN" ] ||
             [ "$ACCESS_TOKEN" = "null" ]; then

            echo "Invalid token"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"

          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"


      - name: End group Token auth
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # IMPORT
      # ===================================================

      - name: Start group Import
        run: echo "::group::Import"


      - name: Import Proxy
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ inputs.resourcetype }}" = "apis" ]; then
            ZIP_FILE="proxy.zip"
          else
            ZIP_FILE="sharedflowbundle.zip"
          fi

          URL="https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/${{ inputs.resourcetype }}?action=import&name=${{ inputs.deploy_proxy }}"

          TOKEN="${{ steps.token.outputs.access_token }}"

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --write-out "\nHTTP_STATUS:%{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -F "file=@$ZIP_FILE" \
            "$URL")

          STATUS=$(echo "$RESPONSE" |
            grep HTTP_STATUS |
            cut -d':' -f2)

          if [ "$STATUS" -ne 200 ]; then
            echo "Import failed"
            echo "$RESPONSE"
            exit 1
          fi

          echo "Import successful"


      - name: End group Import
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # GET REVISION
      # ===================================================

      - name: Start group Revision
        run: echo "::group::Revision"


      - name: Get Latest Revision
        id: revision
        run: |
          set -euo pipefail

          REV=$(curl \
            --silent \
            --show-error \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/${{ inputs.resourcetype }}/${{ inputs.deploy_proxy }}/revisions" \
            | jq -r 'map(tonumber) | max')

          if [ -z "$REV" ] || [ "$REV" = "null" ]; then
            echo "Unable to determine revision"
            exit 1
          fi

          echo "revision=$REV" >> "$GITHUB_OUTPUT"


      - name: End group Revision
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # DEPLOY
      # ===================================================

      - name: Start group Deployment
        run: echo "::group::Deployment"


      - name: Deploy Proxy
        shell: bash
        run: |
          set -euo pipefail

          URL="https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/environments/${{ inputs.apigee_env }}/${{ inputs.resourcetype }}/${{ inputs.deploy_proxy }}/revisions/${{ steps.revision.outputs.revision }}/deployments"

          TOKEN="${{ steps.token.outputs.access_token }}"

          BODY='{ "override": true }'

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --write-out "\nHTTP_STATUS:%{http_code}\n" \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY" \
            "$URL")

          STATUS=$(echo "$RESPONSE" |
            grep HTTP_STATUS |
            cut -d':' -f2)

          if [ "$STATUS" -ne 200 ]; then
            echo "Deployment failed"
            echo "$RESPONSE"
            exit 1
          fi

          echo "Deployment successful"


      - name: End group Deployment
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # VERIFY
      # ===================================================

      - name: Start group Verify
        run: echo "::group::Verify"


      - name: Verify Deployment
        run: |
          set -euo pipefail

          STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer ${{ steps.token.outputs.access_token }}" \
            "https://apigee.googleapis.com/v1/organizations/${{ inputs.apigee_org }}/${{ inputs.resourcetype }}/${{ inputs.deploy_proxy }}")

          if [ "$STATUS" != "200" ]; then
            echo "Proxy does not exist"
            exit 1
          fi

          echo "Deployment verified successfully"


      - name: End group Verify
        if: always()
        run: echo "::endgroup::"


      # ===================================================
      # CLEANUP
      # ===================================================

      - name: Cleanup CI/CD configuration
        if: always()
        run: |
          rm -f apigee-config.json
          echo "Temporary configuration removed"
