name: Scan bundle tests and coverage
run-name: Coverage for ${{ inputs.scan_id }}
on:
  workflow_dispatch:
    inputs:
      scan_id:
        required: true
        type: string
      execution_id:
        required: true
        type: string
      organization_id:
        required: true
        type: string
      bundle_url:
        required: true
        type: string
      artifact_sha256:
        required: true
        type: string
      execution_checks:
        description: "Comma-separated ordered checks: COMPILE,TEST,COVERAGE"
        required: true
        type: string
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Obtain short-lived Forge service token
        env:
          TOKEN_ISSUER_URL: ${{ vars.TOKEN_ISSUER_URL }}
          TOKEN_ISSUER_CLIENT_ID: ${{ vars.TOKEN_ISSUER_CLIENT_ID }}
          TOKEN_ISSUER_CLIENT_SECRET: ${{ secrets.TOKEN_ISSUER_CLIENT_SECRET }}
          TOKEN_ISSUER_AUDIENCE: ${{ vars.TOKEN_ISSUER_AUDIENCE }}
          TOKEN_ISSUER_SCOPE: ${{ vars.TOKEN_ISSUER_SCOPE }}
          ORGANIZATION_ID: ${{ inputs.organization_id }}
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            --user "${TOKEN_ISSUER_CLIENT_ID}:${TOKEN_ISSUER_CLIENT_SECRET}" \
            --data-urlencode 'grant_type=client_credentials' \
            --data-urlencode "audience=${TOKEN_ISSUER_AUDIENCE}" \
            --data-urlencode "organization_id=${ORGANIZATION_ID}" \
            --data-urlencode "scope=${TOKEN_ISSUER_SCOPE}" \
            "${TOKEN_ISSUER_URL}")"
          token="$(jq -er '.access_token' <<<"${response}")"
          echo "::add-mask::${token}"
          echo "SCAN_RUNNER_TOKEN=${token}" >> "${GITHUB_ENV}"
      - name: Build and test in isolated container
        env:
          SCAN_ID: ${{ inputs.scan_id }}
          EXECUTION_ID: ${{ inputs.execution_id }}
          BUNDLE_URL: ${{ inputs.bundle_url }}
          ARTIFACT_SHA256: ${{ inputs.artifact_sha256 }}
          EXECUTION_CHECKS: ${{ inputs.execution_checks }}
          SCAN_API_URL: ${{ vars.SCAN_API_URL }}
        run: python3 scripts/scan_coverage.py
      - name: Remove runner containers after cancellation or failure
        if: always()
        env:
          EXECUTION_ID: ${{ inputs.execution_id }}
        run: docker rm -f "scan-${EXECUTION_ID}-0" "scan-${EXECUTION_ID}-1" 2>/dev/null || true
      - name: Store actual runner reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-coverage-${{ inputs.scan_id }}
          path: scan-output/
          retention-days: 7
          if-no-files-found: warn
